plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0'
group = 'net.kconlac.extraindeco'
archivesBaseName = 'extraindeco'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url = 'https://maven.createmod.net'
    }
    maven {
        url = 'https://maven.tterrag.com/'
    }
    maven {
        url = 'https://maven.ithundxr.dev/mirror'
    }
    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
    flatDir {
        dir 'libs'
    }
    mavenCentral()
}

minecraft {

    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {

        client {
            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                jvmArgs += mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.toList()
            }

            mods {
                extraindeco {
                    source sourceSets.main
                }
            }
        }


        server {

            mods {
                extraindeco {
                    source sourceSets.main
                }
            }

        }


        configureEach {

            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

        }
    }
}


dependencies {

    minecraft 'net.minecraftforge:forge:1.20.1-47.4.8'

    // Create 6.0.8 and its dependencies from Maven
    implementation fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:all") { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91")

}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'extraindeco'
    }
}


tasks.withType(JavaCompile).configureEach {

    options.encoding = 'UTF-8'

}


apply from: 'mcreator.gradle'

